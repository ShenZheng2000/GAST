common_params:
  gpu: "0,1,2,3"
  seed: 1
  experiment_id: "20260313"
  checkpoint: null
  pretrained_model: null


save_params:
  save_path: "/data3/shenzhen/World_Projects/GAST/experiments/Occ3D_nuScenes/"
  save_file: 
    - "/data3/shenzhen/World_Projects/GAST/config/gast_nuscenes.yaml"
    - "/data3/shenzhen/World_Projects/GAST/dataloader/dataset_nus_occ3d.py"
    - "/data3/shenzhen/World_Projects/GAST/models/*.py"
    - "/data3/shenzhen/World_Projects/GAST/tasks/occ3d_nuscenes/*.py"


model_params:
  net_type: "GAST"
  use_gt: True # False
  num_classes: 18
  scene_range: [-40, -40, -1, 40, 40, 5.4]
  bev_sizes: [[50, 50], [100, 100], [200, 200]]
  expansion: 8
  embed_dim: 128
  num_his_frames: 4
  num_fut_frames: 6
  num_patches: 2500 # 50*50, bev_res
  encoder: 
    in_channels: 128  # 8*16, expansion*occ_height
    out_channels: 128 
    base_channels: 64
    channels_mult: [1,2,4]
    num_res_blocks: 2
    input_resolution: 200
    attn_resolutions: [50]
  decoder:
    in_channels: 128
    out_channels: 128 # 8*16, expansion*occ_height
    base_channels: 128
    num_stages: 2 # len(channels_mult)-1
  cross_deform_attn:
    d_model: 128
    d_ffn: 512
    n_levels: 1
    n_heads: 4
    n_points: 8
    n_layers: 1
  self_deform_attn:
    d_model: 128
    d_ffn: 512
    n_levels: 1
    n_heads: 4
    n_points: 8
    n_layers: 1


dataset_params:
  dataset_name: "nuScenes_Occ3D"
  label_path: "/scratch/shenzhen/Datasets/Occ3D_nuscenes/"
  anno_path: "/scratch/shenzhen/Datasets/Occ3D_nuscenes/annotations.json"
  grid_shape: [200, 200, 16]
  return_len: 10
  start_frame: 0
  mid_frame: 4
  end_frame: 10
  cls_freq: [ 2082256, 3012896, 234043, 5385264, 34145527, 2044061, 
              325758, 3330189, 543801, 5784830, 13520735, 175883646, 
              4275424, 51393615, 61411620, 227783782, 252350317, 1892500630 ]

  train_data_loader:
    pkl_file: "/scratch/shenzhen/Datasets/infos/world-nuscenes_infos_train.pkl"
    batch_size: 1
    num_workers: 8   
    
  val_data_loader:
    pkl_file: "/scratch/shenzhen/Datasets/infos/world-nuscenes_infos_val.pkl"
    batch_size: 1
    num_workers: 8


train_params:
  max_num_epochs: 30
  report_epochs: 1
  warmup_epochs: 1
  learning_rate: 0.001
  lr_momentum: 0.9
  optimizer: AdamW  # [SGD, Adam, AdamW]
  momentum: 0.9
  nesterov: True
  weight_decay: 0.01  # SGD:1.0e-4, Adam/AdamW:0.01


infer_params:
  model_path: null
  save_dir: null